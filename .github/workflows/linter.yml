name: Linter
on: pull_request

jobs:
  java:
    name: Lint .java files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
        
      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run Maven formatter
        run: mvn formatter:format

      - name: Commit changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10
        with:
          author_name: PhoenicisBot
          author_email: git@phoenicis.org
          message: 'Lint .java files'
          add: '*.java'
